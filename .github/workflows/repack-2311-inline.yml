name: Repackage the current v2.3.11 inline footer fix

on:
  push:
    paths:
      - '.github/workflows/repack-2311-inline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  php-regression:
    name: PHP ${{ matrix.php }} syntax and footer regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate complete plugin PHP and same-line footer behavior
        run: |
          set -euo pipefail
          find aikey-seo-geo tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/footer-credit-smoke.php

  publish:
    name: Update v2.3.11 installer without creating a new version
    needs: php-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Build installer from current, complete v2.3.11 source
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ \* Version:[[:space:]]+2\.3\.11$' aikey-seo-geo/aikey-seo-geo.php
          grep -Eq '^Stable tag: 2\.3\.11$' aikey-seo-geo/readme.txt
          test ! -e aikey-seo-geo/assets/css/footer-credit.css
          mkdir -p dist
          rm -f dist/*.zip
          zip -q -r dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/ -x '*.DS_Store'
          sha256sum dist/aikey-seo-geo-v2.3.11.zip > SHA256SUMS.txt
          unzip -t dist/aikey-seo-geo-v2.3.11.zip
          unzip -Z1 dist/aikey-seo-geo-v2.3.11.zip | grep -qx 'aikey-seo-geo/aikey-seo-geo.php'
          if unzip -Z1 dist/aikey-seo-geo-v2.3.11.zip | grep -qx 'aikey-seo-geo/assets/css/footer-credit.css'; then
            echo 'Obsolete footer-credit.css found in release ZIP' >&2
            exit 1
          fi
          cmp aikey-seo-geo/src/Core/Plugin.php <(unzip -p dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/src/Core/Plugin.php)
          cmp aikey-seo-geo/readme.txt <(unzip -p dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/readme.txt)
          sha256sum --check SHA256SUMS.txt
      - name: Update tracked v2.3.11 ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/aikey-seo-geo-v2.3.11.zip
          git add SHA256SUMS.txt
          git commit -m "release: rebuild v2.3.11 ZIP with inline copyright and no footer CSS"
          git push origin HEAD:main
      - name: Replace the existing v2.3.11 Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v2.3.11 --json tagName,isDraft,isPrerelease | jq -e '.tagName == "v2.3.11" and (.isDraft == false) and (.isPrerelease == false)'
          gh release upload v2.3.11 dist/aikey-seo-geo-v2.3.11.zip --clobber
          cat > /tmp/aikey-v2.3.11-notes.md <<'NOTES'
          # Aikeyboost SEO&GEO v2.3.11

          面向中国 WordPress 站长、中小企业官网、外贸网站的免费开源 SEO / GEO 插件。

          **核心功能**：百度与中国搜索引擎相关配置、Title/Meta、Canonical、XML Sitemap、Schema.org、GEO 内容诊断、企业品牌实体、多语言 hreflang 与优化工作台。

          **v2.3.11 同版本修复**：Aikeyboost 署名现在直接跟在 GeneratePress 原有版权、ICP备案和其他署名的同一行，继承相同字体大小、颜色和间距。移除此前独立的页脚块、CSS 文件和无用的样式加载代码；移动端可随版权信息自然换行。其他主题仅在有现成版权文字容器时追加行内署名。保留原网站版权与备案信息。SEO/GEO 功能及数据库结构不变。

          **[下载 WordPress 完整 ZIP 安装包](https://github.com/chinrobin6688-cloud/aikeyboost-seo-geo/releases/download/v2.3.11/aikey-seo-geo-v2.3.11.zip)**

          适用：WordPress 6.2+、PHP 8.0+。GitHub 发行版内置前台品牌署名，后台没有关闭选项。源码按照 GPL-2.0-or-later 许可允许修改及再分发。该版本不用于 WordPress.org 插件目录。

          请下载上方正式安装包 ZIP，不要下载自动生成的 Source code ZIP。由于本次保持版本号不变，请在 WordPress 后台覆盖安装，并清理缓存。
          NOTES
          gh release edit v2.3.11 --title 'Aikeyboost SEO&GEO v2.3.11 — WordPress SEO / GEO 免费开源插件' --notes-file /tmp/aikey-v2.3.11-notes.md --latest
          gh release view v2.3.11 --json tagName,assets | jq -e '.tagName == "v2.3.11" and (any(.assets[]; .name == "aikey-seo-geo-v2.3.11.zip" and .size > 100000))'
      - name: Remove one-time workflow and align the existing v2.3.11 tag
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repack-2311-inline.yml
          git commit -m "build: remove completed one-time v2.3.11 packaging workflow"
          git push origin HEAD:main
          old_tag=$(git ls-remote --refs --tags origin refs/tags/v2.3.11 | awk '{ print $1 }')
          test -n "$old_tag"
          git tag -f v2.3.11 HEAD
          git push --force-with-lease="refs/tags/v2.3.11:$old_tag" origin refs/tags/v2.3.11
          test "$(git ls-remote --refs --tags origin refs/tags/v2.3.11 | awk '{ print $1 }')" = "$(git rev-parse HEAD)"
