name: Synchronize v2.3.11 release ZIP into public repository

on:
  push:
    paths:
      - '.github/workflows/sync-v2-3-11-installer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve already-published official installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download v2.3.11 --pattern 'aikey-seo-geo-v2.3.11.zip' --dir dist --clobber
          sha256sum --check SHA256SUMS.txt
          unzip -t dist/aikey-seo-geo-v2.3.11.zip
          unzip -Z1 dist/aikey-seo-geo-v2.3.11.zip | grep -x 'aikey-seo-geo/aikey-seo-geo.php'
          cmp aikey-seo-geo/src/Core/Plugin.php <(unzip -p dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/src/Core/Plugin.php)
          cmp aikey-seo-geo/assets/css/footer-credit.css <(unzip -p dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/assets/css/footer-credit.css)
      - name: Track the exact released ZIP on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/aikey-seo-geo-v2.3.11.zip
          git commit -m "release: retain the exact v2.3.11 installer in dist"
          git push origin HEAD:main
      - name: Run the final quality checks with the published ZIP in git
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run plugin-quality.yml --ref main
