name: Refresh v2.3.11 plugin documentation and ZIP

on:
  push:
    paths:
      - '.github/workflows/repackage-v2-3-11-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  php-checks:
    name: PHP ${{ matrix.php }} safety and regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify source and attribution behavior remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          find aikey-seo-geo tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/footer-credit-smoke.php

  release:
    name: Replace existing v2.3.11 installation ZIP and update release notes
    needs: php-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate documentation focus and version
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ \* Version:[[:space:]]+2\.3\.11$' aikey-seo-geo/aikey-seo-geo.php
          grep -Eq '^Stable tag: 2\.3\.11$' aikey-seo-geo/readme.txt
          if grep -Ei '署名|attribution disclosure|mandatory-on|front.end credit|GEO services powered by Aikeyboost' README.md aikey-seo-geo/readme.txt CHANGELOG.md; then
            echo 'Promotional credit notice still present in user-oriented documentation' >&2
            exit 1
          fi
          grep -q '## 核心功能' README.md
          grep -q '== Description ==' aikey-seo-geo/readme.txt
      - name: Rebuild full v2.3.11 package from maintained source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/*.zip
          zip -q -r dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/ -x '*.DS_Store'
          sha256sum dist/aikey-seo-geo-v2.3.11.zip > SHA256SUMS.txt
          unzip -t dist/aikey-seo-geo-v2.3.11.zip
          unzip -Z1 dist/aikey-seo-geo-v2.3.11.zip | grep -qx 'aikey-seo-geo/aikey-seo-geo.php'
          cmp aikey-seo-geo/readme.txt <(unzip -p dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/readme.txt)
          cmp aikey-seo-geo/src/Core/Plugin.php <(unzip -p dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/src/Core/Plugin.php)
          sha256sum --check SHA256SUMS.txt
      - name: Commit updated v2.3.11 ZIP to public repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/aikey-seo-geo-v2.3.11.zip
          git add SHA256SUMS.txt
          git commit -m "release: refresh v2.3.11 installer with application-focused documentation"
          git push origin HEAD:main
      - name: Replace ZIP asset and simplify release description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v2.3.11 --json tagName,isDraft,isPrerelease | jq -e '.tagName == "v2.3.11" and (.isDraft == false) and (.isPrerelease == false)'
          gh release upload v2.3.11 dist/aikey-seo-geo-v2.3.11.zip --clobber
          cat > /tmp/release-notes.md <<'NOTES'
          # Aikeyboost SEO&GEO v2.3.11

          **适用于中国 WordPress 企业网站、外贸独立站以及 SEO/GEO 运营人员的免费开源优化工具。** 集中管理网站 SEO 基础设施与 AI 搜索时代的内容优化工作。

          ## 核心应用功能

          - **中国搜索引擎优化**：百度站点验证、百度 URL 主动提交、robots.txt、国内搜索引擎抓取与来源统计。
          - **网站技术 SEO**：SEO Title、Meta Description、Canonical、XML Sitemap、Schema.org 结构化数据、404 监控与重定向。
          - **GEO 与 AI 搜索优化辅助**：内容诊断、企业品牌实体、FAQ、事实来源、llms.txt、可选的 AI 内容分析。
          - **全球多语言 SEO**：管理真实翻译页面关联、hreflang、不同语言地区的网站优化基础。
          - **SEO/GEO 优化工作台**：集中查看诊断结果并维护页面、内容和搜索引擎相关设置。

          ## v2.3.11 更新内容

          优化 GeneratePress 页脚布局兼容性，清理冗余前端资源，并完成 PHP 8.0、8.2、8.3 语法与专项回归检查。原有 SEO/GEO 功能、数据和数据库结构保持不变。

          ## 下载与安装

          **[下载 WordPress 可直接上传的完整 ZIP 安装包](https://github.com/chinrobin6688-cloud/aikeyboost-seo-geo/releases/download/v2.3.11/aikey-seo-geo-v2.3.11.zip)**

          适用环境：WordPress 6.2+，PHP 8.0+。下载上方 ZIP，在 WordPress 后台「插件 → 安装插件 → 上传插件」安装。不要使用 GitHub 自动提供的 Source code ZIP。

          插件采用 GPL-2.0-or-later 开源许可证。部分可选的第三方 AI 与搜索服务需自行配置 API 凭据；不保证搜索排名或 AI 平台引用。

          [查看完整功能说明](https://github.com/chinrobin6688-cloud/aikeyboost-seo-geo#readme) · [查看开源许可证](https://github.com/chinrobin6688-cloud/aikeyboost-seo-geo/blob/main/LICENSE)
          NOTES
          gh release edit v2.3.11 --title 'Aikeyboost SEO&GEO v2.3.11 — WordPress SEO / GEO 免费开源插件' --notes-file /tmp/release-notes.md --latest
          gh release view v2.3.11 --json tagName,assets | jq -e '.tagName == "v2.3.11" and (any(.assets[]; .name == "aikey-seo-geo-v2.3.11.zip" and .size > 100000))'
      - name: Remove one-time workflow and align existing tag
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repackage-v2-3-11-docs.yml
          git commit -m "ci: remove completed one-time v2.3.11 packaging workflow"
          git push origin HEAD:main
          previous=$(git ls-remote --refs --tags origin refs/tags/v2.3.11 | awk '{ print $1 }')
          test -n "$previous"
          git tag -f v2.3.11 HEAD
          git push --force-with-lease="refs/tags/v2.3.11:$previous" origin refs/tags/v2.3.11
