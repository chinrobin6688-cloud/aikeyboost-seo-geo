name: Build and publish v2.3.11 WordPress installer

on:
  push:
    paths:
      - '.github/workflows/publish-v2-3-11.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  php-regression:
    name: PHP ${{ matrix.php }} source and footer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint the complete plugin source
        run: find aikey-seo-geo tests -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Run ordering and compatibility regressions
        run: php tests/footer-credit-smoke.php

  publish:
    name: Publish one validated installer and release
    needs: [php-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build v2.3.11 directly from the complete current source
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ \* Version:[[:space:]]+2\.3\.11$' aikey-seo-geo/aikey-seo-geo.php
          grep -Eq '^Stable tag: 2\.3\.11$' aikey-seo-geo/readme.txt
          mkdir -p dist
          rm -f dist/*.zip
          zip -q -r dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/ -x '*.DS_Store'
          sha256sum dist/aikey-seo-geo-v2.3.11.zip > SHA256SUMS.txt
          unzip -t dist/aikey-seo-geo-v2.3.11.zip
          unzip -Z1 dist/aikey-seo-geo-v2.3.11.zip | grep -x 'aikey-seo-geo/aikey-seo-geo.php'
          unzip -p dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/src/Core/Plugin.php | grep -F "PHP_INT_MAX"
          if unzip -p dist/aikey-seo-geo-v2.3.11.zip aikey-seo-geo/src/Core/Plugin.php | grep -F 'generate_before_footer_content'; then
            echo "Legacy early-footer hook found in installer" >&2
            exit 1
          fi
          sha256sum --check SHA256SUMS.txt

      - name: Commit installer ZIP and replace legacy binary in the public branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist SHA256SUMS.txt
          git commit -m "release: replace previous archive with validated v2.3.11 installer"
          git push origin HEAD:main

      - name: Publish v2.3.11 as the latest release with an actual install ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/aikey-v2.3.11-notes.md <<'NOTES'
          # Aikeyboost SEO&GEO v2.3.11

          一款面向中国 WordPress 站长、中小企业官网与外贸多语言独立站的免费开源 SEO/GEO 插件。

          **主要应用能力**：百度与中国搜索引擎配置、SEO Title/Meta、Sitemap、Schema 结构化数据、404 与重定向、GEO 内容诊断、企业信息管理、全球多语言 hreflang 关联。

          **本次修复**：网站底部的 Aikeyboost 署名改为在标准 WordPress 页脚最后输出，位于主题页脚、公司信息、版权与 ICP/公安备案信息之后；不覆盖现有法律声明。更新 PHP 8.0、8.2、8.3 回归测试。数据库结构与 SEO/GEO 功能不变。

          **[下载 WordPress 可直接上传的 ZIP 安装包](https://github.com/chinrobin6688-cloud/aikeyboost-seo-geo/releases/download/v2.3.11/aikey-seo-geo-v2.3.11.zip)**

          要求：WordPress 6.2+，PHP 8.0+。请下载 Releases 附件中的 ZIP，不要使用自动生成的 Source code ZIP。安装前请先备份现有站点。

          安装提示：未经修改的 GitHub 发行版会在网站前台自动显示 Aikeyboost 品牌署名链接，后台没有关闭选项；源码仍按 GPL-2.0-or-later 协议允许修改与再分发。本版本未提交 WordPress.org 插件目录。
          NOTES
          gh release create v2.3.11 dist/aikey-seo-geo-v2.3.11.zip \
            --target "$(git rev-parse HEAD)" \
            --title 'Aikeyboost SEO&GEO v2.3.11 — WordPress SEO / GEO 免费开源插件' \
            --notes-file /tmp/aikey-v2.3.11-notes.md \
            --latest
          gh release view v2.3.11 --json tagName,isDraft,isPrerelease,assets \
            | jq -e '.tagName == "v2.3.11" and (.isDraft == false) and (.isPrerelease == false) and (any(.assets[]; .name == "aikey-seo-geo-v2.3.11.zip" and .size > 100000))'

      - name: Remove the obsolete v2.3.10 GitHub release and tag only after success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v2.3.10 --yes --cleanup-tag
          gh release list --limit 10
          gh workflow run plugin-quality.yml --ref main
