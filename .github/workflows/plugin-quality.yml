name: Plugin quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-checks:
    name: PHP ${{ matrix.php }} syntax and footer regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all plugin and test PHP files
        run: find aikey-seo-geo tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run footer attribution regression assertions
        run: php tests/footer-credit-smoke.php

  package-check:
    name: Verify distributable WordPress ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Verify published package checksums
        run: sha256sum --check SHA256SUMS.txt
      - name: Check install ZIP integrity, layout and embedded version
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.zip)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -qx 'aikey-seo-geo/aikey-seo-geo.php'
          embedded_version=$(unzip -p "$archive" aikey-seo-geo/aikey-seo-geo.php | sed -nE 's/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([0-9.]+).*/\\1/p' | head -n 1)
          test "$(basename "$archive")" = "aikey-seo-geo-v${embedded_version}.zip"
